<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drafts HQ — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#0b1526;--gold:#c8a24a;--primary:#2563eb;--accent:#059669;--warn:#d97706;--danger:#dc2626;--bg:#f6f8fb;--border:#e5eaf1;--muted:#64748b;--r:14px;--rs:9px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#16233a;line-height:1.5}button{font-family:inherit}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1100px 550px at 85% -10%,rgba(200,162,74,.16),transparent),var(--navy)}
.auth-card{width:100%;max-width:440px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.auth-top{background:linear-gradient(135deg,var(--navy),#13223c);padding:30px 28px 22px;text-align:center;border-bottom:3px solid var(--gold)}
.auth-top img{height:50px}.auth-title{font-family:'Playfair Display',serif;color:#fff;font-size:1.6rem;margin-top:8px}
.auth-tag{color:var(--gold);font-size:.64rem;letter-spacing:3.5px;text-transform:uppercase;margin-top:4px}
.auth-body{padding:24px 28px 28px}
label{display:block;font-size:.78rem;font-weight:600;color:#33415c;margin:10px 0 4px}
input{width:100%;padding:10px 12px;border:1px solid #cfd8e6;border-radius:var(--rs);font:inherit}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--rs);padding:10px 16px;font-size:.85rem;font-weight:700;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b08d3e);color:#fff}.btn-blue{background:var(--primary);color:#fff}.btn-green{background:var(--accent);color:#fff}.btn-ghost{background:#fff;border:1px solid var(--border)}
.btn-block{width:100%}.btn-sm{padding:8px 12px;font-size:.78rem}
.err{color:var(--danger);font-size:.82rem;margin-top:10px}
.top{position:sticky;top:0;z-index:50;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.top img{height:38px}.top .t{color:#fff;font-weight:800}.top .s{color:var(--gold);font-size:.66rem;letter-spacing:2px;text-transform:uppercase}
.links{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border)}
.links a{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--border);font-size:.78rem;font-weight:600;color:var(--muted);text-decoration:none}
.links a:hover{border-color:var(--gold);color:var(--navy)}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px}
.stat .k{font-size:.66rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}.stat .v{font-size:1.3rem;font-weight:800;margin-top:4px}.stat .s{font-size:.7rem;color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{font-size:.95rem;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:700;color:#fff}
.chip{display:inline-block;background:rgba(37,99,235,.08);color:var(--primary);border-radius:99px;padding:2px 9px;font-size:.7rem;margin:2px}
.desc{background:#f2f5fa;border-radius:var(--rs);padding:10px;font-size:.85rem;white-space:pre-wrap}
.meta{font-size:.76rem;color:var(--muted);margin:4px 0}.hint{font-size:.75rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
a.wa{color:var(--accent);font-weight:700;text-decoration:none}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://hnbzerhoqqsmzqxcbnxv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYnplcmhvcXFzbXpxeGNibnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDg1MjksImV4cCI6MjA5NDYyNDUyOX0.a4rM51DQGih9SXMr71PREngZ_pT6dJFgv_fG9j5jAGc';
const LOGO='https://i.ibb.co/p6GCfY1x/Screenshot-2026-05-30-at-17-06-41.png';
const ADMINS=['0700000000']; // ← PUT YOUR PHONE NUMBER(S) HERE (as typed at signup)
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const UGX=n=>'UGX '+Number(n||0).toLocaleString();
const sha256=async t=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')};
const BADGE={intake:['New intake','#2563eb'],building:['Building','#b45309'],active:['Active','#047857'],paused:['Paused','#dc2626']};

(async()=>{
 const id=localStorage.getItem('employee_id');
 let me=null;
 if(id){const {data}=await sb.from('employees').select('*').eq('id',id).maybeSingle();me=data;}
 if(!me)return renderLogin();
 if(!ADMINS.includes(me.phone)&&!ADMINS.includes(me.employee_code)){
   $('#app').innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-body" style="text-align:center">
   <h3>Not an admin account</h3><p class="hint" style="margin:10px 0">This portal is for Headquarters. Employees use the main app.</p>
   <a href="index.html" class="btn btn-gold">Open Employee App</a></div></div></div>`;return;}
 renderAdmin(me);
})();

function renderLogin(){
 $('#app').innerHTML=`<div class="auth"><div class="auth-card">
 <div class="auth-top"><img src="${LOGO}"><div class="auth-title">Drafts HQ</div><div class="auth-tag">Headquarters Admin</div></div>
 <div class="auth-body"><label>Username (phone)</label><input id="li-user"><label>Password</label><input id="li-pw" type="password">
 <button class="btn btn-gold btn-block" style="margin-top:14px" id="go">Enter HQ →</button>
 <p class="hint" style="text-align:center;margin-top:10px">Employees? Use <a href="index.html">index.html</a></p><p id="msg" class="err"></p></div></div></div>`;
 $('#go').onclick=async()=>{const u=$('#li-user').value.trim().toLowerCase();
  const {data:c}=await sb.from('employee_credentials').select('*').eq('username',u).maybeSingle();
  if(!c)return $('#msg').textContent='Account not found.';
  const h=await sha256($('#li-pw').value);
  if(c.password_hash!==h&&c.password_hash!==$('#li-pw').value)return $('#msg').textContent='Wrong password.';
  localStorage.setItem('employee_id',c.employee_id);location.reload();};
}

async function renderAdmin(me){
 const [pr,py,em,earn]=await Promise.all([
  sb.from('projects').select('*'),sb.from('payments').select('*'),
  sb.from('employees').select('*'),sb.from('employee_earnings').select('*').eq('type','commission')]);
 const P=pr.data||[],PAY=py.data||[],EMP=em.data||[],E=earn.data||[];
 const paid=PAY.filter(p=>p.status==='paid');
 const rev=paid.reduce((s,p)=>s+Number(p.amount||0),0);
 const names={};EMP.forEach(e=>names[e.id]=`${e.name} (${e.employee_code})`);
 const intake=P.filter(p=>p.status==='intake'||p.status==='building');
 $('#app').innerHTML=`
 <div class="top"><div style="display:flex;align-items:center;gap:10px"><img src="${LOGO}"><div><div class="t">Drafts HQ</div><div class="s">Headquarters</div></div></div>
 <button class="btn btn-ghost btn-sm" onclick="localStorage.clear();location.reload()">Log out</button></div>
 <div class="links"><a href="projects.html">Projects</a><a href="payments.html">Payments</a><a href="clients.html">Clients</a><a href="employees.html">Employees</a><a href="finance.html">Finance</a><a href="reports.html">Reports</a><a href="performance.html">Performance</a></div>
 <div class="wrap">
 <div class="stats">
  <div class="stat"><div class="k">Active projects</div><div class="v">${P.filter(p=>p.status==='active').length}</div><div class="s">${P.length} total</div></div>
  <div class="stat"><div class="k">Revenue collected</div><div class="v">${UGX(rev)}</div><div class="s">≈ $${(rev/3700).toFixed(2)}</div></div>
  <div class="stat"><div class="k">Intake queue</div><div class="v">${intake.length}</div><div class="s">awaiting HQ</div></div>
  <div class="stat"><div class="k">Employees</div><div class="v">${EMP.length}</div><div class="s">field agents</div></div>
 </div>
 <div class="card"><h3>📥 Intake Queue — brought in by employees</h3>
  ${intake.map(r=>{const b=BADGE[r.status];return `<div class="card">
   <div class="row"><b>${r.name}</b><span class="badge" style="background:${b[1]}">${b[0]}</span></div>
   <p class="meta">Client: ${r.client||'—'} · ${r.sector||''} · Monthly ${UGX(r.rate)}</p>
   <p class="meta">By: <b>${names[r.referred_employee_id]||'—'}</b> · ${r.contact_person||''} · <a class="wa" target="_blank" href="https://wa.me/${(r.contact_phone||'').replace(/\D/g,'')}">WhatsApp ${r.contact_phone||''}</a> · ${r.town||''}</p>
   <div>${(r.roles||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div>
   <div class="desc">${r.description||'No description.'}</div>
   ${r.status==='intake'?`<button class="btn btn-blue btn-sm" onclick="setStatus('${r.id}','building')">▶ Start building</button>`:`<button class="btn btn-green btn-sm" onclick="activate('${r.id}')">✔ Activate (30 days)</button>`}
  </div>`}).join('')||'<p class="hint">Queue is empty.</p>'}</div>
 <div class="card"><h3>🏆 Top referrers (20% earners)</h3><table><tr><th>Employee</th><th>Commission entries</th><th>Total</th></tr>
 ${Object.entries(E.reduce((m,c)=>{m[c.employee_id]=m[c.employee_id]||{t:0,n:0};m[c.employee_id].t+=Number(c.amount||0);m[c.employee_id].n++;return m},{})).sort((a,b)=>b[1].t-a[1].t).slice(0,5).map(([id,v])=>`<tr><td>${names[id]||'—'}</td><td>${v.n}</td><td><b style="color:var(--accent)">${UGX(v.t)}</b></td></tr>`).join('')||'<tr><td colspan=3 class="hint">No commissions yet.</td></tr>'}</table></div>
 <div class="card"><h3>All projects</h3>
 <table><tr><th>Project</th><th>Client</th><th>Status</th><th>By</th><th>Monthly</th></tr>
 ${P.map(r=>{const b=BADGE[r.status]||[r.status||'—','#64748b'];return `<tr><td>${r.name}</td><td>${r.client||'—'}</td><td><span class="badge" style="background:${b[1]}">${b[0]}</span></td><td>${names[r.referred_employee_id]||'—'}</td><td>${UGX(r.rate)}</td></tr>`}).join('')}</table></div>
 </div>`;
 window.setStatus=async(id,s)=>{await sb.from('projects').update({status:s}).eq('id',id);location.reload();};
 window.activate=async id=>{await sb.from('projects').update({status:'active',start_date:new Date().toISOString().slice(0,10),valid_until:new Date(Date.now()+30*864e5).toISOString().slice(0,10)}).eq('id',id);location.reload();};
}
</script></body></html>
