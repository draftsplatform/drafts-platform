<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Login — Drafts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:16px;color:#0f172a}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;max-width:420px;margin:40px auto}
label{display:block;margin:8px 0;font-size:14px;color:#334155}
input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:4px}
.btn{width:100%;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px;font-size:15px;cursor:pointer;margin-top:12px}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{flex:1;padding:8px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer}
.tabs button.on{background:#2563eb;color:#fff}#msg{color:#b91c1c;font-size:14px}
</style></head><body>
<div class="card"><h2>Drafts Employee</h2>
 <div class="tabs"><button id="t-login" class="on">Log in</button><button id="t-signup">Create account</button></div>
 <div id="f-login"><label>Phone (username)<input id="li-user"></label><label>Password<input id="li-pw" type="password"></label></div>
 <div id="f-signup" style="display:none"><label>Full name *<input id="su-name"></label>
   <label>Phone (WhatsApp — becomes username) *<input id="su-phone"></label>
   <label>Password * (6+ chars)<input id="su-pw" type="password"></label></div>
 <button class="btn" id="go">Continue</button><p id="msg"></p>
</div>
<script>
const SUPABASE_URL='https://hnbzerhoqqsmzqxcbnxv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYnplcmhvcXFzbXpxeGNibnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDg1MjksImV4cCI6MjA5NDYyNDUyOX0.a4rM51DQGih9SXMr71PREngZ_pT6dJFgv_fG9j5jAGc';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const sha256=async t=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')};
let mode='login';
$('t-login').onclick=()=>{mode='login';$('t-login').classList.add('on');$('t-signup').classList.remove('on');$('f-login').style.display='';$('f-signup').style.display='none'};
$('t-signup').onclick=()=>{mode='signup';$('t-signup').classList.add('on');$('t-login').classList.remove('on');$('f-signup').style.display='';$('f-login').style.display='none'};
$('go').onclick=async()=>{$('msg').textContent='';
 if(mode==='login'){
   const u=$('li-user').value.trim().toLowerCase();
   const {data:cred}=await sb.from('employee_credentials').select('*').eq('username',u).maybeSingle();
   if(!cred){$('msg').textContent='Account not found.';return}
   const h=await sha256($('li-pw').value);
   if(cred.password_hash!==h&&cred.password_hash!==$('li-pw').value){$('msg').textContent='Wrong password.';return}
   localStorage.setItem('employee_id',cred.employee_id);
   localStorage.setItem('employee_session',Date.now().toString());
   location.href='employee-dashboard.html';
 }else{
   const name=$('su-name').value.trim(),phone=$('su-phone').value.trim(),pw=$('su-pw').value;
   if(!name||!phone||pw.length<6){$('msg').textContent='Name, phone and a 6+ char password are required.';return}
   const {data:codes}=await sb.from('employees').select('employee_code').order('employee_code',{ascending:false}).limit(1);
   const code='EMP-'+String((codes&&codes[0]?parseInt(codes[0].employee_code.replace('EMP-',''),10):0)+1).padStart(3,'0');
   const {data:emp,error:e1}=await sb.from('employees').insert({name,phone,title:'Field Agent',employee_code:code}).select().single();
   if(e1){$('msg').textContent='Signup error: '+e1.message;return}
   const {error:e2}=await sb.from('employee_credentials').insert({employee_id:emp.id,username:phone.toLowerCase(),password_hash:await sha256(pw)});
   if(e2){$('msg').textContent='Account created but login setup failed: '+e2.message;return}
   localStorage.setItem('employee_id',emp.id);
   localStorage.setItem('employee_session',Date.now().toString());
   location.href='employee-dashboard.html';
 }};
</script></body></html>
