<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drafts HQ · Login</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
    }

    /* ----- modern classic card (white background) ----- */
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 30px 80px rgba(11, 21, 38, 0.12), 0 12px 32px rgba(11, 21, 38, 0.06);
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }

    /* ----- top section: brand & tagline (no admin text) ----- */
    .login-header {
      background: #ffffff;  /* white background so logo is visible */
      padding: 2.2rem 2rem 1.8rem;
      text-align: center;
      border-bottom: 3px solid #c8a24a;
    }

    .brand-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .brand-icon img {
      height: 56px;
      width: auto;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 2rem;
      color: #0b1526;
      letter-spacing: -0.02em;
      margin-top: 0.2rem;
    }

    .login-sub {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c8a24a;
      margin-top: 6px;
      opacity: 0.9;
    }

    /* ----- form body (no admin details) ----- */
    .login-body {
      padding: 2rem 2rem 2.2rem;
      background: #ffffff;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #1e2a44;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .input-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      background: #fafcff;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-group input:focus {
      border-color: #c8a24a;
      box-shadow: 0 0 0 4px rgba(200, 162, 74, 0.12);
      background: #ffffff;
    }

    .input-group input::placeholder {
      color: #a0b3cc;
      font-weight: 400;
      font-size: 0.9rem;
    }

    /* ----- modern classic button (gold) ----- */
    .btn-login {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: linear-gradient(135deg, #c8a24a, #b08d3e);
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      color: #ffffff;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(200, 162, 74, 0.25);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(200, 162, 74, 0.3);
      background: linear-gradient(135deg, #d4ae56, #b8963e);
    }

    .btn-login:active {
      transform: scale(0.97);
      box-shadow: 0 4px 12px rgba(200, 162, 74, 0.2);
    }

    /* ----- create account button (outline style) ----- */
    .btn-create {
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: transparent;
      border: 2px solid #c8a24a;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #0b1526;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #ffffff;
    }

    .btn-create:hover {
      background: #c8a24a;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(200, 162, 74, 0.2);
      border-color: #c8a24a;
    }

    .btn-create:active {
      transform: scale(0.97);
    }

    /* ----- helper text & error ----- */
    .form-footer {
      margin-top: 1.4rem;
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
    }

    .form-footer a {
      color: #0b1526;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1.5px dotted #c8a24a;
      transition: border-color 0.2s;
    }

    .form-footer a:hover {
      border-bottom-color: #0b1526;
    }

    .error-msg {
      color: #dc2626;
      font-size: 0.82rem;
      font-weight: 500;
      margin-top: 0.9rem;
      text-align: center;
      min-height: 1.6rem;
      background: #fef2f2;
      padding: 0.4rem 0.8rem;
      border-radius: 40px;
      display: inline-block;
      width: auto;
      margin-left: auto;
      margin-right: auto;
      padding: 0.4rem 1.2rem;
    }

    .error-msg:empty {
      display: none;
    }

    /* subtle classic divider */
    .divider-text {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.2rem 0 0.8rem;
      color: #9aa9c2;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .divider-text::before,
    .divider-text::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    /* extra small screens */
    @media (max-width: 480px) {
      .login-header {
        padding: 1.8rem 1.2rem 1.4rem;
      }
      .login-body {
        padding: 1.6rem 1.2rem 1.8rem;
      }
      .login-title {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Header: brand + tagline (white background, logo visible) -->
    <div class="login-header">
      <div class="brand-icon">
        <!-- logo — visible on white background -->
        <img 
          src="https://i.ibb.co/p6GCfY1x/Screenshot-2026-05-30-at-17-06-41.png" 
          alt="Drafts HQ logo"
          width="56"
          height="56"
        />
      </div>
      <div class="login-title">Drafts HQ</div>
      <div class="login-sub">Headquarters · secure access</div>
    </div>

    <!-- Body: login form + create account button -->
    <div class="login-body">
      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            placeholder="e.g. 0700000000" 
            value=""
            autocomplete="username"
          />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span>Sign in</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

        <!-- Create Account button (visible) -->
        <button type="button" class="btn-create" id="createAccountBtn">
          <span>Create account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </button>

        <div id="loginError" class="error-msg"></div>

        <div class="divider-text">secure · classic</div>

        <div class="form-footer">
          Employees? use <a href="index.html">employee app</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase + minimal logic (no admin hardcode) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (function() {
      // ----- supabase config (kept from original) -----
      const SUPABASE_URL = 'https://hnbzerhoqqsmzqxcbnxv.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYnplcmhvcXFzbXpxeGNibnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDg1MjksImV4cCI6MjA5NDYyNDUyOX0.a4rM51DQGih9SXMr71PREngZ_pT6dJFgv_fG9j5jAGc';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // SHA-256 helper (from original)
      const sha256 = async (text) => {
        const data = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(digest))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      };

      // DOM refs
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const errorEl = document.getElementById('loginError');
      const createBtn = document.getElementById('createAccountBtn');

      // Check if already logged in (employee_id in localStorage)
      const existingId = localStorage.getItem('employee_id');
      if (existingId) {
        // redirect to dashboard (root)
        window.location.href = 'index.html';
      }

      // Handle login
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';

        const username = usernameInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (!username || !password) {
          errorEl.textContent = 'Please fill in both fields.';
          return;
        }

        try {
          // 1. fetch employee_credentials
          const { data: creds, error: credError } = await sb
            .from('employee_credentials')
            .select('employee_id, password_hash')
            .eq('username', username)
            .maybeSingle();

          if (credError || !creds) {
            errorEl.textContent = 'Account not found.';
            return;
          }

          // 2. verify password
          const hashedInput = await sha256(password);
          const storedHash = creds.password_hash;

          if (hashedInput !== storedHash && password !== storedHash) {
            errorEl.textContent = 'Wrong password.';
            return;
          }

          // 3. save employee_id and redirect to admin dashboard
          localStorage.setItem('employee_id', creds.employee_id);
          window.location.href = 'index.html';
        } catch (err) {
          errorEl.textContent = 'Something went wrong. Please try again.';
          console.error(err);
        }
      });

      // Create account button: simple alert (placeholder for real flow)
      createBtn.addEventListener('click', () => {
        alert('Create account flow: please contact your admin or use the employee app to sign up.');
        // In a real app, you would redirect to a signup page or open a modal.
        // For now we keep it simple.
      });

      // clear error on input
      usernameInput.addEventListener('input', () => { errorEl.textContent = ''; });
      passwordInput.addEventListener('input', () => { errorEl.textContent = ''; });
    })();
  </script>
</body>
</html>
