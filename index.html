<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafts HQ — Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
    --navy: #0b1526;
    --gold: #c8a24a;
    --gold-light: #e8d5a3;
    --gold-hover: #b08d3e;
    --primary: #2563eb;
    --bg: #f6f8fb;
    --border: #e5eaf1;
    --muted: #64748b;
    --text: #16233a;
    --shadow: 0 25px 80px rgba(11, 21, 38, 0.35);
    --radius: 16px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    background: var(--bg);
}

/* Premium background with subtle gradient */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(ellipse at 20% 50%, rgba(200, 162, 74, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(37, 99, 235, 0.06) 0%, transparent 60%),
        linear-gradient(180deg, #f8fafc 0%, #eef1f7 100%);
    z-index: -1;
}

/* Decorative elements */
body::after {
    content: '';
    position: fixed;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(200, 162, 74, 0.06) 0%, transparent 70%);
    border-radius: 50%;
    z-index: -1;
}

.login-container {
    width: 100%;
    max-width: 480px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
}

@keyframes fadeUp {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.login-card {
    background: #ffffff;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.8);
}

/* Header with gold accent and white background for logo visibility */
.login-header {
    background: #ffffff;
    padding: 40px 40px 32px;
    text-align: center;
    position: relative;
    border-bottom: 3px solid var(--gold);
}

.logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
}

.logo-wrapper img {
    height: 64px;
    width: auto;
}

.login-title {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-top: 4px;
}

.login-subtitle {
    color: var(--gold);
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 6px;
}

/* Login body */
.login-body {
    padding: 36px 40px 40px;
}

.login-body .welcome-text {
    font-size: 0.95rem;
    color: var(--text);
    font-weight: 600;
    margin-bottom: 4px;
}

.login-body .welcome-sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 24px;
}

/* Form elements */
.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #33415c;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
}

.form-group label .required {
    color: #dc2626;
    margin-left: 2px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    opacity: 0.5;
    z-index: 1;
}

.input-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 44px;
    border: 2px solid #e8ecf3;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    transition: all 0.3s ease;
    background: #fafbfc;
    color: var(--text);
}

.input-wrapper input:focus {
    outline: none;
    border-color: var(--gold);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(200, 162, 74, 0.1);
}

.input-wrapper input::placeholder {
    color: #b0bccf;
    font-weight: 400;
}

.input-wrapper input[type="password"] {
    padding-right: 44px;
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.4;
    transition: opacity 0.2s;
    padding: 4px;
    z-index: 1;
}

.toggle-password:hover {
    opacity: 0.8;
}

/* Options row */
.login-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 0.82rem;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    cursor: pointer;
    font-weight: 500;
}

.remember-me input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--gold);
    cursor: pointer;
    border-radius: 4px;
}

.forgot-link {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
}

.forgot-link:hover {
    color: var(--gold-hover);
    text-decoration: underline;
}

/* Login button */
.login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--gold), var(--gold-hover));
    border: none;
    border-radius: 10px;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 0.5px;
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(200, 162, 74, 0.35);
}

.login-btn:active {
    transform: translateY(0);
}

.login-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
    transition: left 0.6s;
}

.login-btn:hover::after {
    left: 100%;
}

.login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* Create Account Button */
.create-account-section {
    margin-top: 16px;
    display: flex;
    justify-content: center;
}

.create-account-btn {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 2px solid var(--gold);
    border-radius: 10px;
    color: var(--gold);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 0.3px;
    background: rgba(200, 162, 74, 0.05);
}

.create-account-btn:hover {
    background: var(--gold);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(200, 162, 74, 0.25);
}

.create-account-btn:active {
    transform: translateY(0);
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    margin: 20px 0 16px;
    gap: 16px;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
}

.divider span {
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
}

/* Error message */
.error-message {
    margin-top: 14px;
    padding: 10px 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    color: #dc2626;
    font-size: 0.82rem;
    font-weight: 500;
    display: none;
}

.error-message.show {
    display: block;
    animation: shake 0.4s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
}

/* Footer links */
.login-footer {
    text-align: center;
    padding-top: 20px;
    border-top: 1px solid #eef1f7;
    margin-top: 20px;
}

.login-footer .hint {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 500;
}

.login-footer .hint a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s;
}

.login-footer .hint a:hover {
    color: var(--gold-hover);
    text-decoration: underline;
}

/* Loading spinner */
.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #ffffff;
    animation: spin 0.8s ease-in-out infinite;
    vertical-align: middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 500px) {
    .login-header {
        padding: 30px 24px 24px;
    }
    
    .login-body {
        padding: 24px 24px 28px;
    }
    
    .login-title {
        font-size: 1.5rem;
    }
    
    .logo-wrapper img {
        height: 50px;
    }
    
    .login-options {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }
}

/* Modal for Create Account */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(11, 21, 38, 0.6);
    backdrop-filter: blur(8px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
}

.modal-overlay.active {
    display: flex;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-content {
    background: #ffffff;
    border-radius: var(--radius);
    padding: 40px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 90vh;
    overflow-y: auto;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
}

.modal-header h2 {
    font-family: 'Playfair Display', serif;
    color: var(--navy);
    font-size: 1.5rem;
}

.modal-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--muted);
    padding: 4px 8px;
    transition: color 0.2s;
}

.modal-close:hover {
    color: var(--text);
}

.modal-body .form-group {
    margin-bottom: 16px;
}

.modal-body .hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
}

.modal-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

.modal-footer .btn-secondary {
    width: 100%;
    padding: 12px;
    background: var(--gold);
    border: none;
    border-radius: 10px;
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.9rem;
}

.modal-footer .btn-secondary:hover {
    background: var(--gold-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(200, 162, 74, 0.3);
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-wrapper">
                <img src="https://i.ibb.co/p6GCfY1x/Screenshot-2026-05-30-at-17-06-41.png" alt="Drafts HQ Logo">
            </div>
            <div class="login-title">Drafts HQ</div>
            <div class="login-subtitle">Headquarters Admin Portal</div>
        </div>
        
        <div class="login-body">
            <div class="welcome-text">Welcome back</div>
            <div class="welcome-sub">Sign in to manage your projects and team</div>
            
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Phone Number <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Enter your phone number"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                </div>
                
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link" onclick="alert('Contact your administrator to reset your password.')">Forgot password?</a>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    Sign In →
                </button>
            </form>
            
            <!-- Divider -->
            <div class="divider">
                <span>or</span>
            </div>
            
            <!-- Create Account Button -->
            <div class="create-account-section">
                <button class="create-account-btn" id="createAccountBtn">
                    ✨ Create New Account
                </button>
            </div>
            
            <div class="error-message" id="errorMessage">
                <span id="errorText">Invalid credentials</span>
            </div>
            
            <div class="login-footer">
                <p class="hint">
                    Employees? Use the <a href="index.html">employee portal</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Create Account Modal -->
<div class="modal-overlay" id="createAccountModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>✨ Create Account</h2>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="modal-body">
            <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 20px;">
                Create a new admin account. You'll need an employee ID to register.
            </p>
            <form id="createAccountForm">
                <div class="form-group">
                    <label>Employee ID <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🆔</span>
                        <input type="text" id="newEmployeeId" placeholder="Enter your employee ID" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="text" id="newPhone" placeholder="Enter your phone number" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="newName" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" placeholder="Create a password" required minlength="6">
                    </div>
                    <p class="hint">Minimum 6 characters</p>
                </div>
                <div class="form-group">
                    <label>Confirm Password <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <span class="input-icon">✓</span>
                        <input type="password" id="newPasswordConfirm" placeholder="Confirm your password" required>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="createAccountSubmit">Create Account</button>
            <p id="createError" style="color: #dc2626; font-size: 0.82rem; margin-top: 10px; display: none;"></p>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://hnbzerhoqqsmzqxcbnxv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYnplcmhvcXFzbXpxeGNibnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDg1MjksImV4cCI6MjA5NDYyNDUyOX0.a4rM51DQGih9SXMr71PREngZ_pT6dJFgv_fG9j5jAGc';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// SHA-256 hash function
const sha256 = async (text) => {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
};

// DOM elements
const form = document.getElementById('loginForm');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorMessage = document.getElementById('errorMessage');
const errorText = document.getElementById('errorText');
const rememberMe = document.getElementById('rememberMe');
const togglePassword = document.querySelector('.toggle-password');
const createAccountBtn = document.getElementById('createAccountBtn');
const modal = document.getElementById('createAccountModal');
const modalClose = document.getElementById('modalClose');

// Toggle password visibility
togglePassword.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
});

// Modal controls
createAccountBtn.addEventListener('click', () => {
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
});

modalClose.addEventListener('click', closeModal);

modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

function closeModal() {
    modal.classList.remove('active');
    document.body.style.overflow = '';
    document.getElementById('createError').style.display = 'none';
}

// Check for saved credentials on load
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('drafts_hq_username');
    if (saved) {
        usernameInput.value = saved;
        rememberMe.checked = true;
    }
});

// Form submission
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = usernameInput.value.trim().toLowerCase();
    const password = passwordInput.value.trim();
    
    if (!username || !password) {
        showError('Please enter both username and password');
        return;
    }
    
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';
    hideError();
    
    try {
        const { data: cred, error: credError } = await sb
            .from('employee_credentials')
            .select('*')
            .eq('username', username)
            .maybeSingle();
        
        if (credError || !cred) {
            showError('Account not found. Please check your credentials.');
            resetButton();
            return;
        }
        
        const hashedInput = await sha256(password);
        const isValid = cred.password_hash === hashedInput || cred.password_hash === password;
        
        if (!isValid) {
            showError('Invalid password. Please try again.');
            resetButton();
            return;
        }
        
        const { data: employee, error: empError } = await sb
            .from('employees')
            .select('*')
            .eq('id', cred.employee_id)
            .maybeSingle();
        
        if (empError || !employee) {
            showError('Employee record not found.');
            resetButton();
            return;
        }
        
        const { data: adminCheck } = await sb
            .from('admin_users')
            .select('employee_id')
            .eq('employee_id', cred.employee_id)
            .maybeSingle();
        
        const ADMIN_PHONES = ['0700000000'];
        const isAdmin = adminCheck || ADMIN_PHONES.includes(employee.phone);
        
        if (!isAdmin) {
            showError('Access denied. This portal is for administrators only.');
            resetButton();
            return;
        }
        
        localStorage.setItem('employee_id', cred.employee_id);
        if (rememberMe.checked) {
            localStorage.setItem('drafts_hq_username', username);
        }
        
        window.location.href = 'admin.html';
        
    } catch (error) {
        console.error('Login error:', error);
        showError('An error occurred during login. Please try again.');
        resetButton();
    }
});

// Create Account
document.getElementById('createAccountSubmit').addEventListener('click', async () => {
    const employeeId = document.getElementById('newEmployeeId').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const name = document.getElementById('newName').value.trim();
    const password = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('newPasswordConfirm').value;
    const errorEl = document.getElementById('createError');
    
    // Validation
    if (!employeeId || !phone || !name || !password || !confirmPassword) {
        errorEl.textContent = 'Please fill in all fields.';
        errorEl.style.display = 'block';
        return;
    }
    
    if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.style.display = 'block';
        return;
    }
    
    if (password !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
    }
    
    errorEl.style.display = 'none';
    const submitBtn = document.getElementById('createAccountSubmit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating...';
    
    try {
        // Check if employee exists
        const { data: emp } = await sb
            .from('employees')
            .select('id')
            .eq('employee_code', employeeId)
            .maybeSingle();
        
        if (!emp) {
            errorEl.textContent = 'Employee ID not found. Please check with your administrator.';
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
            return;
        }
        
        // Check if already has credentials
        const { data: existing } = await sb
            .from('employee_credentials')
            .select('id')
            .eq('employee_id', emp.id)
            .maybeSingle();
        
        if (existing) {
            errorEl.textContent = 'This employee already has an account.';
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
            return;
        }
        
        // Hash password and create credentials
        const hashedPassword = await sha256(password);
        const { error: insertError } = await sb
            .from('employee_credentials')
            .insert([{
                employee_id: emp.id,
                username: phone,
                password_hash: hashedPassword
            }]);
        
        if (insertError) {
            throw insertError;
        }
        
        // Add to admin users
        await sb
            .from('admin_users')
            .insert([{ employee_id: emp.id }]);
        
        // Success - close modal and show message
        alert('✅ Account created successfully! You can now log in with your phone number.');
        closeModal();
        usernameInput.value = phone;
        document.getElementById('newEmployeeId').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newPasswordConfirm').value = '';
        
    } catch (error) {
        console.error('Create account error:', error);
        errorEl.textContent = 'Error creating account. Please try again.';
        errorEl.style.display = 'block';
    }
    
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Account';
});

function showError(message) {
    errorText.textContent = message;
    errorMessage.classList.add('show');
}

function hideError() {
    errorMessage.classList.remove('show');
}

function resetButton() {
    loginBtn.disabled = false;
    loginBtn.innerHTML = 'Sign In →';
}

// Enter key on inputs
usernameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
});
passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
});

// Auto-dismiss error
let errorTimeout;
usernameInput.addEventListener('focus', () => {
    clearTimeout(errorTimeout);
    hideError();
});
passwordInput.addEventListener('focus', () => {
    clearTimeout(errorTimeout);
    hideError();
});
</script>

</body>
</html>
