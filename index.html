<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drafts — Employee Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--navy:#0b1526;--navy2:#13223c;--gold:#c8a24a;--gold2:#e6c878;--primary:#2563eb;--accent:#059669;--warn:#d97706;--danger:#dc2626;--bg:#f6f8fb;--border:#e5eaf1;--text:#16233a;--muted:#64748b;--r:14px;--rs:9px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}button{font-family:inherit}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1100px 550px at 85% -10%,rgba(200,162,74,.16),transparent),radial-gradient(900px 500px at 5% 110%,rgba(37,99,235,.14),transparent),var(--navy)}
.auth-card{width:100%;max-width:440px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.auth-top{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:32px 28px 24px;text-align:center;border-bottom:3px solid var(--gold)}
.auth-top img{height:52px}.auth-title{font-family:'Playfair Display',serif;color:#fff;font-size:1.7rem;margin-top:8px}
.auth-tag{color:var(--gold);font-size:.64rem;letter-spacing:3.5px;text-transform:uppercase;margin-top:4px}
.auth-body{padding:24px 28px 28px}.gold-line{width:54px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));margin:0 auto 14px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;padding:10px;border:1px solid var(--border);background:#fbfcfe;border-radius:var(--rs);cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
label{display:block;font-size:.78rem;font-weight:600;color:#33415c;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfd8e6;border-radius:var(--rs);font:inherit;font-size:.9rem}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(200,162,74,.35);border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--rs);padding:11px 18px;font-size:.88rem;font-weight:700;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,var(--gold),#b08d3e);color:#fff}.btn-blue{background:var(--primary);color:#fff}.btn-green{background:var(--accent);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}.btn-block{width:100%}.btn-sm{padding:8px 12px;font-size:.78rem}
.err{color:var(--danger);font-size:.82rem;margin-top:10px}.ok{color:var(--accent);font-size:.82rem;margin-top:10px}
.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.top img{height:40px}.who{text-align:right}.who b{font-size:.9rem}.who span{display:block;font-size:.68rem;color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border)}
.nav button{white-space:nowrap;padding:9px 14px;border-radius:99px;border:1px solid var(--border);background:#fbfcfe;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px}
.stat .k{font-size:.66rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-size:1.3rem;font-weight:800;margin-top:4px}.stat .s{font-size:.7rem;color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{font-size:.95rem;margin-bottom:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:700;color:#fff}
.chip{display:inline-block;background:rgba(37,99,235,.08);color:var(--primary);border-radius:99px;padding:2px 9px;font-size:.7rem;margin:2px}
.desc{background:#f2f5fa;border-radius:var(--rs);padding:10px;font-size:.85rem;white-space:pre-wrap}
.meta{font-size:.76rem;color:var(--muted);margin:4px 0}.hint{font-size:.75rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://hnbzerhoqqsmzqxcbnxv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYnplcmhvcXFzbXpxeGNibnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDg1MjksImV4cCI6MjA5NDYyNDUyOX0.a4rM51DQGih9SXMr71PREngZ_pT6dJFgv_fG9j5jAGc';
const LOGO='https://i.ibb.co/p6GCfY1x/Screenshot-2026-05-30-at-17-06-41.png';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const UGX=n=>'UGX '+Number(n||0).toLocaleString();
const USD=n=>'≈ $'+(Number(n||0)/3700).toFixed(2);
const sha256=async t=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')};
const ROLE_RATE=33000;
const SECTORS=[
 {name:'Corporate / Enterprise',roles:['CEO','General Manager','Finance','HR','Admin','Staff']},
 {name:'Schools & Education',roles:['Director','Principal','DOS','Bursar','Secretary','Teacher','Parent Portal']},
 {name:'Churches & Mosques',roles:['Lead Pastor / Imam','Treasury','Admin','Ministry Leaders','Member Portal']},
 {name:'Factories & Industry',roles:['Plant Manager','Production','Inventory','Maintenance','HR','QC']},
 {name:'SACCOs & Investments',roles:['Board','Credit Officer','Treasurer','Auditor','Member Portal']},
 {name:'NGOs & Non-Profits',roles:['Country Director','Project Mgr','M&E Officer','Grants Mgr']}];
const BADGE={intake:['Intake','#2563eb'],building:['Building','#b45309'],active:['Active','#047857'],paused:['Paused','#b91c1c']};
let ME=null,CH=[];
function clearCharts(){CH.forEach(c=>c.destroy());CH=[];}

async function boot(){
  const id=localStorage.getItem('employee_id');
  if(id){const {data}=await sb.from('employees').select('*').eq('id',id).maybeSingle();
    if(data){ME=data;return renderApp();}}
  renderLogin();
}

/* ============ LOGIN (modern + classic) ============ */
function renderLogin(){
 $('#app').innerHTML=`<div class="auth"><div class="auth-card">
  <div class="auth-top"><img src="${LOGO}" alt="Drafts"><div class="auth-title">Drafts Platform</div><div class="auth-tag">Tracking Progress · Est. 2026</div></div>
  <div class="auth-body"><div class="gold-line"></div>
   <div class="tabs"><button id="t-login" class="on">Log in</button><button id="t-signup">Create account</button></div>
   <div id="f-login"><label>Username (phone)</label><input id="li-user"><label>Password</label><input id="li-pw" type="password"></div>
   <div id="f-signup" style="display:none"><label>Full name *</label><input id="su-name"><label>Phone (WhatsApp) *</label><input id="su-phone"><label>Password * (6+ chars)</label><input id="su-pw" type="password"></div>
   <button class="btn btn-gold btn-block" style="margin-top:14px" id="go">Continue →</button>
   <p class="hint" style="text-align:center;margin-top:12px">Headquarters? Use <a href="admin.html">admin.html</a></p>
   <p id="msg"></p></div></div></div>`;
 let mode='login';
 $('#t-login').onclick=()=>{mode='login';$('#t-login').classList.add('on');$('#t-signup').classList.remove('on');$('#f-login').style.display='';$('#f-signup').style.display='none'};
 $('#t-signup').onclick=()=>{mode='signup';$('#t-signup').classList.add('on');$('#t-login').classList.remove('on');$('#f-signup').style.display='';$('#f-login').style.display='none'};
 $('#go').onclick=async()=>{$('#msg').className='err';$('#msg').textContent='';
  if(mode==='login'){
    const u=$('#li-user').value.trim().toLowerCase();
    const {data:c}=await sb.from('employee_credentials').select('*').eq('username',u).maybeSingle();
    if(!c)return $('#msg').textContent='Account not found.';
    const h=await sha256($('#li-pw').value);
    if(c.password_hash!==h&&c.password_hash!==$('#li-pw').value)return $('#msg').textContent='Wrong password.';
    localStorage.setItem('employee_id',c.employee_id);location.reload();
  }else{
    const name=$('#su-name').value.trim(),phone=$('#su-phone').value.trim(),pw=$('#su-pw').value;
    if(!name||!phone||pw.length<6)return $('#msg').textContent='Name, phone and a 6+ char password are required.';
    const {data:codes}=await sb.from('employees').select('employee_code').order('employee_code',{ascending:false}).limit(1);
    const code='EMP-'+String((codes&&codes[0]?parseInt(codes[0].employee_code.replace('EMP-',''),10):0)+1).padStart(3,'0');
    const {data:emp,error:e1}=await sb.from('employees').insert({name,phone,title:'Field Agent',employee_code:code}).select().single();
    if(e1)return $('#msg').textContent='Signup error: '+e1.message;
    const {error:e2}=await sb.from('employee_credentials').insert({employee_id:emp.id,username:phone.toLowerCase(),password_hash:await sha256(pw)});
    if(e2)return $('#msg').textContent='Login setup failed: '+e2.message;
    localStorage.setItem('employee_id',emp.id);location.reload();
  }};
}

/* ============ APP SHELL ============ */
function renderApp(){
 $('#app').innerHTML=`
 <div class="top"><img src="${LOGO}" alt="Drafts"><div class="who"><b>${ME.name}</b><span>${ME.employee_code} · ${ME.title||'Field Agent'}</span></div></div>
 <div class="nav" id="nav">
  <button data-t="dash" class="on">📊 Dashboard</button>
  <button data-t="projects">📁 My Projects</button>
  <button data-t="intake">➕ Bring in Project</button>
  <button data-t="earn">💰 Earnings</button>
  <button data-t="acct">👤 My Account</button>
 </div><div class="wrap" id="view"></div>`;
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
   document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
   b.classList.add('on');show(b.dataset.t);});
 show('dash');
}
function show(t){clearCharts();
 ({dash:renderDash,projects:renderProjects,intake:renderIntake,earn:renderEarn,acct:renderAcct})[t]();}

async function fetchData(){
 const [p,e,s]=await Promise.all([
  sb.from('projects').select('*').eq('referred_employee_id',ME.id),
  sb.from('employee_earnings').select('*').eq('employee_id',ME.id),
  sb.from('employee_earnings_summary').select('*').eq('id',ME.id).maybeSingle()]);
 return {P:p.data||[],E:e.data||[],S:s.data};
}

/* ============ DASHBOARD ============ */
async function renderDash(){
 const {P,E,S}=await fetchData();
 const bal=S?Number(S.account_balance||0):E.reduce((s,r)=>s+Number(r.amount||0),0);
 const earned=S?Number(S.total_commissions||0)+Number(S.total_salary||0):E.reduce((s,r)=>s+Number(r.amount||0),0);
 $('#view').innerHTML=`
 <div class="card row" style="margin-top:0"><div><h3 style="margin:0">Welcome back, ${ME.name.split(' ')[0]} 👋</h3><p class="meta">Every payment on your projects earns you 20%.</p></div>
 <button class="btn btn-blue" onclick="document.querySelector('[data-t=intake]').click()">➕ Bring in Project</button></div>
 <div class="stats">
  <div class="stat"><div class="k">Available balance</div><div class="v">${UGX(bal)}</div><div class="s">${USD(bal)}</div></div>
  <div class="stat"><div class="k">Total earned</div><div class="v">${UGX(earned)}</div><div class="s">all time</div></div>
  <div class="stat"><div class="k">Active projects</div><div class="v">${P.filter(r=>r.status==='active').length}</div><div class="s">earning for you</div></div>
  <div class="stat"><div class="k">In pipeline</div><div class="v">${P.filter(r=>['intake','building'].includes(r.status)).length}</div><div class="s">intake / building</div></div>
 </div>
 <div class="grid2">
  <div class="card"><h3>Project pipeline</h3><canvas id="c1"></canvas></div>
  <div class="card"><h3>Commission trend</h3><canvas id="c2"></canvas></div>
 </div>
 <div class="card"><h3>Recent earnings</h3><table><tr><th>Date</th><th>Amount</th></tr>${E.slice(0,6).map(r=>`<tr><td>${new Date(r.created_at||Date.now()).toLocaleDateString()}</td><td><b style="color:var(--accent)">+${UGX(r.amount)}</b></td></tr>`).join('')||'<tr><td colspan=2 class="hint">No earnings yet.</td></tr>'}</table></div>`;
 const by={};P.forEach(r=>by[r.status]=(by[r.status]||0)+1);
 CH.push(new Chart($('#c1'),{type:'doughnut',data:{labels:Object.keys(by).length?Object.keys(by):['none'],datasets:[{data:Object.keys(by).length?Object.values(by):[1],backgroundColor:['#2563eb','#b45309','#047857','#b91c1c']}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}));
 const mo=new Array(12).fill(0);E.forEach(r=>{const d=new Date(r.created_at||Date.now());if(d.getFullYear()===new Date().getFullYear())mo[d.getMonth()]+=Number(r.amount||0)});
 CH.push(new Chart($('#c2'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],datasets:[{data:mo,backgroundColor:'#c8a24a',borderRadius:5}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}}));
}

/* ============ MY PROJECTS ============ */
async function renderProjects(){
 const {P}=await fetchData();
 $('#view').innerHTML=`<div class="card" style="margin-top:0"><h3>My Projects (${P.length})</h3>
 <table><tr><th>Project</th><th>Status</th><th>Monthly</th><th>Valid until</th></tr>
 ${P.map(r=>{const b=BADGE[r.status]||[r.status||'—','#64748b'];const d=r.valid_until?Math.max(0,Math.ceil((new Date(r.valid_until)-Date.now())/864e5)):null;
  return `<tr><td><b>${r.name}</b><br><span class="hint">${r.client||''}</span></td><td><span class="badge" style="background:${b[1]}">${b[0]}</span>${d!==null&&r.status==='active'?`<br><span class="hint">${d}d left</span>`:''}</td><td>${UGX(r.rate)}</td><td>${r.valid_until?new Date(r.valid_until).toLocaleDateString():'—'}</td></tr>`}).join('')||'<tr><td colspan=4 class="hint">Nothing yet — bring in your first project!</td></tr>'}</table></div>`;
}

/* ============ INTAKE ============ */
async function renderIntake(){
 $('#view').innerHTML=`<div class="card" style="margin-top:0"><h3>➕ Bring in a Project</h3>
 <label>Organisation / client name *</label><input id="in-org" placeholder="e.g. St. Mary's Church">
 <label>Contact person *</label><input id="in-person">
 <label>WhatsApp / phone *</label><input id="in-phone" placeholder="07xx xxx xxx">
 <label>Town / address</label><input id="in-town">
 <label>Sector *</label><select id="in-sector"><option value="">— choose —</option>${SECTORS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('')}</select>
 <div id="in-roles"></div>
 <label>What should the system do? (HQ builds from this) *</label><textarea id="in-desc" rows="4"></textarea>
 <label class="row" style="font-weight:500"><span style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="in-consent" style="width:auto"> Client approves price & description *</span></label>
 <div class="row"><strong id="in-total"></strong><button class="btn btn-gold" id="in-submit">Submit to HQ</button></div>
 <p id="in-msg"></p></div>`;
 let chosen=[];
 $('#in-sector').onchange=e=>{const s=SECTORS[+e.target.value];if(!s)return;
  $('#in-roles').innerHTML=`<p class="hint" style="margin-top:8px">Dashboards included (33,000 UGX / $9 each — un-tick to remove):</p>`+s.roles.map(r=>`<label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" value="${r}" checked style="width:auto"> ${r}</label>`).join('');
  document.querySelectorAll('#in-roles input').forEach(cb=>cb.onchange=upd);upd();};
 function upd(){chosen=[...document.querySelectorAll('#in-roles input:checked')].map(c=>c.value);
  $('#in-total').textContent=chosen.length?`Monthly: ${UGX(chosen.length*ROLE_RATE)} · your 20%/payment: ${UGX(chosen.length*ROLE_RATE*0.2)}`:'';}
 $('#in-submit').onclick=async()=>{const v=id=>$(id).value.trim();const sec=$('#in-sector');
  $('#in-msg').className='err';
  if(!v('#in-org')||!v('#in-person')||!v('#in-phone')||sec.value===''||!chosen.length||!v('#in-desc')||!$('#in-consent').checked)
    return $('#in-msg').textContent='Complete all required fields and tick consent.';
  const {error}=await sb.from('projects').insert({name:v('#in-org')+' — '+SECTORS[+sec.value].name,client:v('#in-org'),rate:chosen.length*ROLE_RATE,sector:SECTORS[+sec.value].name,roles:chosen,description:v('#in-desc'),contact_person:v('#in-person'),contact_phone:v('#in-phone'),town:v('#in-town'),status:'intake',referred_employee_id:ME.id});
  if(error){$('#in-msg').textContent='Error: '+error.message;return;}
  $('#in-msg').className='ok';$('#in-msg').textContent='✔ Sent to HQ. You earn 20% of every payment.';
  setTimeout(()=>{document.querySelector('[data-t=projects]').click()},1200);};
}

/* ============ EARNINGS ============ */
async function renderEarn(){
 const {E}=await fetchData();
 const tot=E.reduce((s,r)=>s+Number(r.amount||0),0);
 $('#view').innerHTML=`<div class="stats" style="grid-template-columns:repeat(2,1fr)">
  <div class="stat"><div class="k">Total commissions</div><div class="v">${UGX(tot)}</div><div class="s">${USD(tot)}</div></div>
  <div class="stat"><div class="k">Transactions</div><div class="v">${E.length}</div><div class="s">20% per payment</div></div></div>
 <div class="card"><h3>All earnings</h3><table><tr><th>Date</th><th>Project</th><th>Amount</th></tr>
 ${E.map(r=>`<tr><td>${new Date(r.created_at||Date.now()).toLocaleDateString()}</td><td class="hint">${r.project_id?'payment on your project':'—'}</td><td><b style="color:var(--accent)">+${UGX(r.amount)}</b></td></tr>`).join('')||'<tr><td colspan=3 class="hint">No earnings yet.</td></tr>'}</table></div>`;
}

/* ============ MY ACCOUNT ============ */
async function renderAcct(){
 const {S}=await fetchData();
 const bal=S?Number(S.account_balance||0):0;
 const {data:W=[]}=await sb.from('withdrawal_requests').select('*').eq('employee_id',ME.id);
 $('#view').innerHTML=`
 <div class="card" style="margin-top:0"><h3>👤 Profile</h3>
  <p class="meta">Name: <b>${ME.name}</b> · Code: <b>${ME.employee_code}</b></p>
  <p class="meta">Phone: ${ME.phone||'—'} · Role: ${ME.title||'Field Agent'}</p>
  <p class="meta">Referral code: <b>${ME.employee_code}</b> — clients mention this when they call HQ.</p></div>
 <div class="card"><h3>💳 Funds</h3>
  <div class="row"><div><div class="stat v" style="font-size:1.5rem">${UGX(bal)}</div><div class="s hint">${USD(bal)} available</div></div>
  <button class="btn btn-green" id="wd-open">🏧 Withdraw</button></div>
  <div id="wd-form" style="display:none;margin-top:12px">
   <label>Amount (UGX) — max ${UGX(bal)}</label><input id="wd-amt" type="number">
   <button class="btn btn-gold btn-block" style="margin-top:10px" id="wd-go">Request withdrawal</button></div>
  <p id="wd-msg"></p>
  <h3 style="margin-top:14px">Withdrawal history</h3>
  <table><tr><th>Date</th><th>Amount</th><th>Status</th></tr>${W.map(w=>`<tr><td>${new Date(w.created_at||w.requested_at||Date.now()).toLocaleDateString()}</td><td>${UGX(w.amount)}</td><td><span class="badge" style="background:${w.status==='approved'||w.status==='paid'?'#047857':w.status==='rejected'?'#b91c1c':'#b45309'}">${w.status||'pending'}</span></td></tr>`).join('')||'<tr><td colspan=3 class="hint">No withdrawals yet.</td></tr>'}</table></div>
 <div class="card"><h3>🔒 Security</h3>
  <label>New password</label><input id="pw-new" type="password">
  <button class="btn btn-ghost btn-sm" style="margin-top:8px" id="pw-go">Change password</button><p id="pw-msg"></p></div>
 <div class="card"><button class="btn btn-ghost btn-block" id="lo">Log out</button></div>`;
 $('#lo').onclick=()=>{localStorage.clear();location.reload();};
 $('#wd-open').onclick=()=>{$('#wd-form').style.display=$('#wd-form').style.display==='none'?'':'none'};
 $('#wd-go').onclick=async()=>{const a=Number($('#wd-amt').value);$('#wd-msg').className='err';
  if(!a||a<=0)return $('#wd-msg').textContent='Enter a valid amount.';
  if(a>bal)return $('#wd-msg').textContent='Amount exceeds available balance.';
  const {error}=await sb.from('withdrawal_requests').insert({employee_id:ME.id,amount:a,status:'pending'});
  if(error)return $('#wd-msg').textContent='Error: '+error.message;
  $('#wd-msg').className='ok';$('#wd-msg').textContent='✔ Withdrawal requested — HQ will process it.';
  setTimeout(renderAcct,1200);};
 $('#pw-go').onclick=async()=>{const p=$('#pw-new').value;$('#pw-msg').className='err';
  if(p.length<6)return $('#pw-msg').textContent='6+ characters.';
  const {error}=await sb.from('employee_credentials').update({password_hash:await sha256(p)}).eq('employee_id',ME.id);
  $('#pw-msg').className=error?'err':'ok';$('#pw-msg').textContent=error?error.message:'✔ Password updated.';};
}
boot();
</script></body></html>
