<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Dashboard — Drafts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="intake.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:16px;color:#0f172a}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:12px 0}
label{display:block;margin:8px 0;font-size:14px;color:#334155}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-top:4px}
.chk{display:flex;gap:6px;align-items:center}.chk input{width:auto}.hint{font-size:12px;color:#64748b}
.btn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e2e8f0;vertical-align:top}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}
.stats{display:flex;gap:12px;flex-wrap:wrap}.stats .card{flex:1;min-width:140px}
</style></head><body>
<div class="row"><h2 id="hello"></h2><div><button class="btn" id="new">+ Bring in Project</button>
<button class="btn" style="background:#64748b" id="out">Log out</button></div></div>
<div class="stats">
 <div class="card"><div class="hint">My balance (20% commissions)</div><h3 id="bal">—</h3></div>
 <div class="card"><div class="hint">Active projects</div><h3 id="act">—</h3></div>
 <div class="card"><div class="hint">In pipeline (intake/building)</div><h3 id="pipe">—</h3></div>
</div>
<div id="intake"></div>
<div class="card"><h3>My Projects</h3><table><tr><th>Project</th><th>Status</th><th>Monthly</th><th>Valid until</th></tr><tbody id="proj"></tbody></table></div>
<div class="card"><h3>My Commission Earnings</h3><table><tr><th>Date</th><th>Amount (20%)</th></tr><tbody id="earn"></tbody></table></div>
<script>
const SUPABASE_URL='https://hnbzerhoqqsmzqxcbnxv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuYnplcmhvcXFzbXpxeGNibnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDg1MjksImV4cCI6MjA5NDYyNDUyOX0.a4rM51DQGih9SXMr71PREngZ_pT6dJFgv_fG9j5jAGc';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const empId=localStorage.getItem('employee_id');
if(!empId)location.href='employee-login.html';
const BADGE={intake:['Intake','#2563eb'],building:['Building','#b45309'],active:['Active','#047857'],paused:['Paused','#b91c1c']};
$('out').onclick=()=>{localStorage.removeItem('employee_id');localStorage.removeItem('employee_session');location.href='employee-login.html'};
$('new').onclick=()=>renderIntakeForm($('intake'),sb,{id:empId},load);
async function load(){
 const {data:emp}=await sb.from('employees').select('*').eq('id',empId).single();
 $('hello').textContent=`${emp.name} (${emp.employee_code})`;
 const {data:sum}=await sb.from('employee_earnings_summary').select('*').eq('id',empId).maybeSingle();
 const {data:e=[]}=await sb.from('employee_earnings').select('*').eq('employee_id',empId);
 const bal=sum?Number(sum.account_balance||0):e.reduce((s,r)=>s+Number(r.amount||0),0);
 $('bal').textContent=`UGX ${bal.toLocaleString()} (≈ $${(bal/3700).toFixed(2)})`;
 const {data:p=[]}=await sb.from('projects').select('*').eq('referred_employee_id',empId);
 $('act').textContent=p.filter(r=>r.status==='active').length;
 $('pipe').textContent=p.filter(r=>['intake','building'].includes(r.status)).length;
 $('proj').innerHTML=p.map(r=>{const b=BADGE[r.status]||[r.status,'#64748b'];
   const days=r.valid_until?` · ${Math.max(0,Math.ceil((new Date(r.valid_until)-Date.now())/864e5))}d left`:'';
   return `<tr><td><b>${r.name}</b><br><span class="hint">${r.client||''}</span></td>
   <td><span class="badge" style="background:${b[1]}">${b[0]}</span>${days}</td>
   <td>UGX ${Number(r.rate||0).toLocaleString()}</td><td>${r.valid_until?new Date(r.valid_until).toLocaleDateString():'—'}</td></tr>`}).join('')
   ||'<tr><td colspan="4" class="hint">No projects yet — tap “+ Bring in Project”.</td></tr>';
 $('earn').innerHTML=e.slice(0,15).map(r=>`<tr><td>${new Date(r.created_at||Date.now()).toLocaleDateString()}</td>
   <td>UGX ${Number(r.amount||0).toLocaleString()}</td></tr>`).join('')
   ||'<tr><td colspan="2" class="hint">You earn 20% of every payment on your projects.</td></tr>';
}
load();
</script></body></html>
